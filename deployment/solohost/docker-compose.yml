services:
  backend:
    image: ghcr.io/pi-node/infrapilot-ai-api:1.0.0
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      OLLAMA_BASE_URL: '${OLLAMA_BASE_URL}'
      OLLAMA_MODEL: '${OLLAMA_MODEL}'
      METRIC_COLLECTION_INTERVAL_SECONDS: '${METRIC_COLLECTION_INTERVAL_SECONDS}'
      SECRET_KEY: '${SECRET_KEY}'
    volumes:
      - infrapilot_data:/app/data
      - infrapilot_reports:/app/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    image: ghcr.io/pi-node/infrapilot-ai:1.0.0
    restart: unless-stopped
    labels:
      pi.ui.primary: "true"
    ports:
      - "127.0.0.1:19420:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  infrapilot_data:
  infrapilot_reports:
